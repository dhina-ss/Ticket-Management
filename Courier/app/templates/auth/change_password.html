{% extends 'base.html' %}
{% block title %}Change Password{% endblock %}
{% block content %}
<div class="row align-items-center mb-3 mt-3">
  <div class="col">
    <h4 class="fw-bold mb-0"><i class="bi bi-key me-2 text-primary"></i>Change Password</h4>
  </div>
  <div class="col-auto">
    <a href="{{ url_for('main.dashboard') }}" class="btn btn-sm btn-outline-secondary"><i class="bi bi-arrow-left me-1"></i>Back</a>
  </div>
</div>
<div class="card border-0 shadow-sm" style="max-width:420px;">
  <div class="card-body p-4">
    <form method="POST">
      <div class="mb-3">
        <label class="form-label fw-semibold">Current Password</label>
        <input type="password" name="current_password" class="form-control" required placeholder="Your current password">
      </div>
      <div class="mb-3">
        <label class="form-label fw-semibold">New Password</label>
        <input type="password" name="new_password" class="form-control" required minlength="6" placeholder="Min 6 characters">
      </div>
      <div class="mb-4">
        <label class="form-label fw-semibold">Confirm New Password</label>
        <input type="password" name="confirm_password" class="form-control" required minlength="6" placeholder="Repeat new password">
      </div>
      <button type="submit" class="btn btn-primary w-100"><i class="bi bi-shield-check me-1"></i>Update Password</button>
    </form>
  </div>
</div>
{% endblock %}
