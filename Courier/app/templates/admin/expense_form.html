{% extends 'base.html' %}
{% block title %}{{ 'Edit' if expense else 'Add' }} Expense{% endblock %}
{% block content %}
<div class="row align-items-center mb-3 mt-3">
  <div class="col">
    <h4 class="fw-bold mb-0"><i class="bi bi-cash-stack me-2 text-primary"></i>{{ 'Edit' if expense else 'Add' }} Expense</h4>
  </div>
  <div class="col-auto">
    <a href="{{ url_for('admin.expenses') }}" class="btn btn-sm btn-outline-secondary"><i class="bi bi-arrow-left me-1"></i>Back</a>
  </div>
</div>
<div class="card border-0 shadow-sm" style="max-width:520px;">
  <div class="card-body p-4">
    <form method="POST">
      <div class="mb-3">
        <label class="form-label fw-semibold">Date <span class="text-danger">*</span></label>
        <input type="date" name="date" class="form-control" required
               value="{{ expense.date.isoformat() if expense and expense.date else today }}">
      </div>
      <div class="mb-3">
        <label class="form-label fw-semibold">Description <span class="text-danger">*</span></label>
        <input type="text" name="description" class="form-control" required
               value="{{ expense.description if expense else '' }}" placeholder="e.g. DTDC Monthly Bill – October">
      </div>
      <div class="mb-3">
        <label class="form-label fw-semibold">Courier Company</label>
        <select name="courier_name" class="form-select">
          <option value="">-- Select --</option>
          {% for cn in ['DTDC','RK Courier','AIR CARGO','PNS','Car Parcel','Other'] %}
          <option value="{{ cn }}" {% if expense and expense.courier_name == cn %}selected{% endif %}>{{ cn }}</option>
          {% endfor %}
        </select>
      </div>
      <div class="mb-3">
        <label class="form-label fw-semibold">Payment Mode</label>
        <select name="payment_mode" class="form-select">
          <option value="">-- Select --</option>
          <option value="Monthly Bill" {% if expense and expense.payment_mode == 'Monthly Bill' %}selected{% endif %}>Monthly Bill</option>
          <option value="Petty Cash" {% if expense and expense.payment_mode == 'Petty Cash' %}selected{% endif %}>Petty Cash</option>
        </select>
      </div>
      {% if current_user.is_superadmin() %}
      <div class="mb-3">
        <label class="form-label fw-semibold">Branch</label>
        <select name="branch_id" class="form-select">
          {% for b in branches %}
          <option value="{{ b.id }}" {% if expense and expense.branch_id == b.id %}selected{% elif not expense and current_user.branch_id == b.id %}selected{% endif %}>
            {{ b.name }}
          </option>
          {% endfor %}
        </select>
      </div>
      {% endif %}
      <div class="mb-3">
        <label class="form-label fw-semibold">Amount (₹) <span class="text-danger">*</span></label>
        <div class="input-group">
          <span class="input-group-text">₹</span>
          <input type="number" step="0.01" name="amount" class="form-control" required
                 value="{{ expense.amount if expense else '' }}" placeholder="0.00">
        </div>
      </div>
      <div class="mb-3">
        <label class="form-label fw-semibold">Remarks</label>
        <textarea name="remarks" class="form-control" rows="2"
                  placeholder="Optional notes…">{{ expense.remarks if expense else '' }}</textarea>
      </div>
      <div class="d-flex gap-2">
        <button type="submit" class="btn btn-primary"><i class="bi bi-save me-1"></i>{{ 'Update' if expense else 'Save' }} Expense</button>
        <a href="{{ url_for('admin.expenses') }}" class="btn btn-outline-secondary">Cancel</a>
      </div>
    </form>
  </div>
</div>
{% endblock %}
